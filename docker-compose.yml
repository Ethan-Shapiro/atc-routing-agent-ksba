x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: data_pipeline/docker/airflow.Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-postgres:5432/${AIRFLOW_DB}
    # Domain PostGIS connection, read directly via psycopg2 in the housekeeping DAGs below —
    # a plain env var is simpler than an Airflow Connection object for a single fixed target.
    POSTGIS_DSN: postgresql://${POSTGIS_USER}:${POSTGIS_PASSWORD}@postgis:5432/${POSTGIS_DB}
  volumes:
    - ./data_pipeline/dags:/opt/airflow/dags
  networks:
    - atc_net
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGIS_DB}
      POSTGRES_USER: ${POSTGIS_USER}
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data_pipeline/sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGIS_USER} -d ${POSTGIS_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - atc_net

  # Deliberately a separate physical database from postgis — keeps Airflow's own schema
  # migrations decoupled from the domain telemetry schema.
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${AIRFLOW_DB}
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - atc_net

  airflow-init:
    build:
      context: .
      dockerfile: data_pipeline/docker/airflow.Dockerfile
    environment:
      <<: *airflow-common-env
    entrypoint: ["bash", "-c"]
    # `airflow users create` is deliberately not run here: this image's Airflow 3.3.0 +
    # apache-airflow-providers-fab 3.7.1 combination has `AirflowSecurityManagerV2` missing
    # `find_role`/`get_all_roles` (an upstream auth-manager mismatch, not a project config
    # issue), so the FAB user/role CLI commands raise AttributeError. DAG correctness doesn't
    # depend on this — verify via `airflow dags list` / `dags test` instead. Revisit this once
    # switching the apiserver to SimpleAuthManager or pinning a compatible fab-provider version,
    # if/when a working web UI login is needed.
    command: ["airflow db migrate"]
    networks:
      - atc_net
    depends_on:
      airflow-postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: ["airflow", "api-server"]
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: ["airflow", "scheduler"]

  # Airflow 3.x split DAG file parsing out of the scheduler into its own mandatory component.
  airflow-dag-processor:
    <<: *airflow-common
    command: ["airflow", "dag-processor"]

  airflow-triggerer:
    <<: *airflow-common
    command: ["airflow", "triggerer"]

  # The hot-path OpenSky ingestion service. Deliberately NOT an Airflow DAG — see README /
  # plan notes on why sub-minute polling doesn't belong in Airflow's scheduler model.
  opensky-poller:
    build:
      context: .
      dockerfile: data_pipeline/poller/Dockerfile
    env_file: .env
    environment:
      POSTGIS_HOST: postgis
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    networks:
      - atc_net

  # Phase 2 — behind a profile so a plain `docker compose up` doesn't try to build it.
  # Runs as a long-lived SSE service (not stdio) so agent_orchestration, a separate
  # container, can reach it over atc_net rather than needing to spawn it as a subprocess.
  mcp_server:
    profiles: ["phase2", "phase3"]
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    env_file: .env
    # The FAISS index/chunks are build artifacts of vector_db/ingest.py, not baked into the
    # image — bind-mounting means rebuilding the index doesn't require rebuilding the image,
    # and `docker compose run --rm mcp_server python vector_db/ingest.py` persists its output
    # to the host instead of being discarded with the throwaway container.
    volumes:
      - ./mcp_server/vector_db:/app/vector_db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - atc_net
    depends_on:
      postgis:
        condition: service_healthy

  # Phase 3 — behind a profile for the same reason as mcp_server above. Also listed under
  # mcp_server's profiles (above) so `docker compose --profile phase3 up` brings both up
  # together — agent_orchestration is a real MCP client of mcp_server, not optional.
  agent_orchestration:
    profiles: ["phase3"]
    build:
      context: .
      dockerfile: agent_orchestration/Dockerfile
    env_file: .env
    environment:
      MCP_SERVER_URL: http://mcp_server:8001/sse
    # Dev convenience, same rationale as mcp_server's vector_db bind mount above: edit
    # dashboard/ files live without rebuilding the image.
    volumes:
      - ./dashboard:/app/dashboard
    ports:
      - "8000:8000"
    networks:
      - atc_net
    depends_on:
      postgis:
        condition: service_healthy
      mcp_server:
        condition: service_healthy

  # Phase 5 — offline reward scoring. Not a long-lived service; run one-off via
  # `docker compose --profile phase5 run --rm evaluation python score_episode.py ...`.
  evaluation:
    profiles: ["phase5"]
    build:
      context: .
      dockerfile: evaluation/Dockerfile
    env_file: .env
    networks:
      - atc_net
    depends_on:
      postgis:
        condition: service_healthy

networks:
  atc_net:
    driver: bridge

volumes:
  pgdata:
  airflow_pgdata:
